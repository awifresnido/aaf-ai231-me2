name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training deps
        run: |
          python -m pip install --upgrade pip
          pip install -r env/requirements-train.txt

      - name: Install app deps
        run: |
          pip install -r env/requirements-app.txt
          pip install pytest ruff

      - name: App unit tests (data/Pi tests skip with a reason)
        run: |
          cd app && pytest -q

      - name: Training unit tests
        run: |
          cd training && PYTHONPATH=src pytest -q

      - name: Model smoke test (tiny fixture)
        run: |
          PYTHONPATH=training python -c "import yaml; from src.vcm_models_v2 import build_model; cfg=yaml.safe_load(open('configs/train_config.yaml'))['model']; [print(a, sum(p.numel() for p in build_model({**cfg,'arch':a}, 21, 40).parameters())) for a in ['tcresnet','crnn_attn','dscnn']]"

      - name: reproduce.sh --dry-run
        run: |
          ./reproduce.sh --dry-run
          ./reproduce.sh --dry-run --train dgx --gpus 0,1,3
          ./reproduce.sh --dry-run --pi pi-host

      - name: Figures check (fails on diff)
        run: |
          python docs/figures/make_figures.py --check

      - name: Public-repo hygiene check
        run: |
          python scripts/check_public.py

      - name: Secret scan
        run: |
          python scripts/secret_scan.py
