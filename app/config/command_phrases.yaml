# 'say' phrasings per command leaf class, generated from tiny-vcm's
# configs/recording_prompts.csv (three variations per class). Used by the
# benchmark random set to pick a natural phrasing for each drawn class.
phrases:
  "ALARM|6:00 AM": ["Alarm 6:00 AM", "Wake me up at 6:00 AM", "Set an alarm for 6:00 AM"]
  "ALARM|8:00 AM": ["Alarm 8:00 AM", "Wake me up at 8:00 AM", "Set an alarm for 8:00 AM"]
  "ALARM|9:00 PM": ["Alarm 9:00 PM", "Wake me up at 9:00 PM", "Set an alarm for 9:00 PM"]
  "BRIGHTNESS|100 percent": ["Brightness 100 percent", "Set the brightness to 100 percent", "Change the brightness to 100 percent"]
  "BRIGHTNESS|20 percent": ["Brightness 20 percent", "Set the brightness to 20 percent", "Change the brightness to 20 percent"]
  "BRIGHTNESS|60 percent": ["Brightness 60 percent", "Set the brightness to 60 percent", "Change the brightness to 60 percent"]
  "CALL": ["Call", "Make a call", "Make a phone call"]
  "COLOR|Blue": ["Color Blue", "Change the lights to Blue", "Set the lights to Blue"]
  "COLOR|Green": ["Color Green", "Change the lights to Green", "Set the lights to Green"]
  "COLOR|Red": ["Color Red", "Change the lights to Red", "Set the lights to Red"]
  "CREATE_REMINDER|Drink water": ["Reminder Drink water", "Remind me to Drink water", "Create a reminder to Drink water"]
  "CREATE_REMINDER|Exercise": ["Reminder Exercise", "Remind me to Exercise", "Create a reminder to Exercise"]
  "CREATE_REMINDER|Study": ["Reminder Study", "Remind me to Study", "Create a reminder to Study"]
  "LIGHT_OFF": ["Lights off", "Kill the lights", "Turn off the lights"]
  "LIGHT_ON": ["Lights on", "Power on the lights", "Turn on the lights"]
  "LIST_REMINDERS": ["Reminders", "Show my reminders", "List my reminders"]
  "MESSAGE": ["Message", "Send a message", "Send my message"]
  "NEXT": ["Skip song", "Next song", "Play next song"]
  "PAUSE": ["Pause", "Pause the music", "Pause this song"]
  "PLAY_MUSIC": ["Play music", "Play a song", "Start the music"]
  "STOP": ["Stop song", "Stop music", "Stop playing music"]
  "TEMPERATURE|18 degrees": ["Temperature 18 degrees", "Change the temperature to 18 degrees", "Set the temperature to 18 degrees"]
  "TEMPERATURE|22 degrees": ["Temperature 22 degrees", "Change the temperature to 22 degrees", "Set the temperature to 22 degrees"]
  "TEMPERATURE|26 degrees": ["Temperature 26 degrees", "Change the temperature to 26 degrees", "Set the temperature to 26 degrees"]
  "TIME": ["Time", "What time is it?", "Tell me the time"]
  "TIMER|1 minute": ["Timer 1 minute", "Countdown for 1 minute", "Start a timer for 1 minute"]
  "TIMER|10 seconds": ["Timer 10 seconds", "Countdown for 10 seconds", "Start a timer for 10 seconds"]
  "TIMER|30 seconds": ["Timer 30 seconds", "Countdown for 30 seconds", "Start a timer for 30 seconds"]
  "VOLUME_DOWN": ["Volume down", "Lower the volume", "Turn the volume down"]
  "VOLUME_UP": ["Volume up", "Increase the volume", "Turn the volume up"]
  "WEATHER": ["Weather", "What's the weather?", "Tell me the weather"]
