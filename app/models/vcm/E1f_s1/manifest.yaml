id: E1f_s1
display_name: Focus (CRNN-Attn Gold)
description: Focus fine-tuned on the ME2 Gold dataset plus Awi's practice session.
  Best gold-trained model; the app default.
based_on: CRNN with attention (conv + GRU + attention pooling)
task: vcm
engine: onnx_tinyvcm
weights: ../../../../exports/me2_gold/E1f_s1/model.onnx
architecture:
  arch: crnn_attn
  width_mult: 1.0
  kernel: 9
  channels: 64
  n_blocks: 4
  dropout_rate: 0.1
  gradient_clip: 1.0
label_scheme: leaf
labels:
- ALARM|6:00 AM
- ALARM|8:00 AM
- ALARM|9:00 PM
- BRIGHTNESS|20 percent
- BRIGHTNESS|60 percent
- BRIGHTNESS|100 percent
- CALL
- COLOR|Red
- COLOR|Blue
- COLOR|Green
- CREATE_REMINDER|Drink water
- CREATE_REMINDER|Study
- CREATE_REMINDER|Exercise
- LIGHT_OFF
- LIGHT_ON
- LIST_REMINDERS
- MESSAGE
- NEXT
- PAUSE
- PLAY_MUSIC
- SILENCE
- STOP
- TEMPERATURE|18 degrees
- TEMPERATURE|22 degrees
- TEMPERATURE|26 degrees
- TIME
- TIMER|10 seconds
- TIMER|30 seconds
- TIMER|1 minute
- UNKNOWN
- VOLUME_DOWN
- VOLUME_UP
- WEATHER
features:
  sample_rate: 16000
  n_mels: 40
  n_fft: 512
  hop_length: 160
  f_min: 50
  f_max: 7600
  top_db: 80.0
  trim_db: 40.0
  max_duration_s: 3.0
reject:
  min_confidence: 0.95
  non_command_labels:
  - UNKNOWN
  - SILENCE
quantization: fp32
lineage:
  training_phase: phase2
  training_data: me2_gold_v1
  git_commit: bc2ff80
  mlflow_run_id: null
  init_checkpoint: E1_s1/best.pt
  notes: fine-tuned from E1_s1 (v1 CRNN-Attn) on ME2 Gold rev 6947f130 (strict load);
    selected on command_macro_f1 over gold_real + personal_awi s02.
offline_metrics: {}
engine_options:
  num_threads: 1
scores:
  validation:
    dataset_id: me2_gold_v1
    split: validation
    metrics:
      tuning_session_correct: 0.914
      gold_test_speaker_correct: 0.6927
      single_words_far: 0.004
    threshold: 0.95
    source: results/me2_gold/eval_E1f_s1.json (per-seed, tau 0.95)
    status: reported
  test:
    dataset_id: me2_gold_v1
    split: test
    metrics:
      holdout_correct: 0.9839
      final_test_session_correct: 0.9462
      command_macro_f1: 0.9715
    threshold: 0.95
    source: results/me2_gold/eval_E1f_s1.json + logs/summary_E1f_s1.json
    status: reported
