id: G2_s0
display_name: Benchmark (DS-CNN)
task: vcm
engine: onnx_tinyvcm
weights: ../../../../tiny-vcm/exports/G2_s0/model.onnx
architecture:
  arch: dscnn
  channels: 112
  n_blocks: 4
  dropout_rate: 0.1
  gradient_clip: 1.0
label_scheme: leaf
labels:
- ALARM|6:00 AM
- ALARM|8:00 AM
- ALARM|9:00 PM
- BRIGHTNESS|20 percent
- BRIGHTNESS|60 percent
- BRIGHTNESS|100 percent
- CALL
- COLOR|Red
- COLOR|Blue
- COLOR|Green
- CREATE_REMINDER|Drink water
- CREATE_REMINDER|Study
- CREATE_REMINDER|Exercise
- LIGHT_OFF
- LIGHT_ON
- LIST_REMINDERS
- MESSAGE
- NEXT
- PAUSE
- PLAY_MUSIC
- SILENCE
- STOP
- TEMPERATURE|18 degrees
- TEMPERATURE|22 degrees
- TEMPERATURE|26 degrees
- TIME
- TIMER|10 seconds
- TIMER|30 seconds
- TIMER|1 minute
- UNKNOWN
- VOLUME_DOWN
- VOLUME_UP
- WEATHER
features:
  sample_rate: 16000
  n_mels: 40
  n_fft: 512
  hop_length: 160
  f_min: 50
  f_max: 7600
  top_db: 80.0
  trim_db: 40.0
  max_duration_s: 3.0
reject:
  min_confidence: 0.87
  non_command_labels:
  - UNKNOWN
  - SILENCE
quantization: fp32
lineage:
  training_phase: phase2
  training_data: composite_v1
  git_commit: bc39d7e
  mlflow_run_id: null
  trained_on: DGX ai-n003 (branch dscnn-benchmark)
  notes: Benchmark model, not a replacement for Sweep/Focus. DS-CNN, Hello Edge architecture,
    112 ch x 4 blocks, trained from scratch on B2's exact protocol (Seeds G2_s0-s4).
    Registered from ../tiny-vcm/checkpoints/G2_s0/best.pt; weights referenced in place,
    ONNX from tiny-vcm/exports/G2_s0 (see tiny-vcm/DSCNN_BENCHMARK_RESULTS.md).
offline_metrics: {}
engine_options:
  num_threads: 2
description: The field-standard tiny keyword model, retrained on Blend v1 at the same
  size as Sweep and Focus. Reads the sound as a grid of small time-frequency tiles.
based_on: DS-CNN (depthwise-separable 2-D CNN, Hello Edge)
scores:
  training:
    dataset_id: composite_v1
    split: train
    metrics:
      train_acc: 0.6986
    threshold: null
    source: checkpoints/G2_s0/best.pt history (train_acc at the best epoch, 21 entries)
    note: on augmented training batches (not comparable to validation)
    status: reported
  validation:
    dataset_id: composite_v1
    split: validation
    threshold: 0.87
    metrics:
      command_correct: 0.3173
      command_correct_mean5: 0.4078
      command_wrong: 0.0047
      command_wrong_mean5: 0.0058
      far: 0.0183
      far_mean5: 0.0262
      tuning_session_correct: 0.6735
      tuning_session_correct_mean5: 0.7796
      single_words_far_mean5: 0.0736
      command_macro_f1_tau0_mean5: 0.8791
      four_s_window_correct_min_position_mean5: 0.735
    source: 'DSCNN_BENCHMARK_RESULTS.md section D2 (results/dscnn/analysis.json):
      Tuning Session (personal s02) + Home Commands validation, tau 0.87 = lowest
      tau where every seed has command-wrong <= 1 %. Values without a _mean5 suffix
      are seed G2_s0; _mean5 are the 5-seed means.'
    status: reported
  test:
    dataset_id: composite_v1
    split: test
    threshold: 0.87
    metrics:
      command_correct: 0.6714
      command_wrong: 0.0034
      far: 0.0486
      final_test_session_correct: 0.7347
      command_macro_f1: 0.9494
    source: DSCNN_BENCHMARK_RESULTS.md section D2 test-split table (one-shot, tau
      0.87, results/dscnn/eval/eval_G2_s0_test.json)
    status: reported
