id: E1_s0
display_name: Focus (CRNN-Attn)
description: Listens in order and focuses on the deciding word. Best at telling on/off
  and up/down apart.
based_on: CRNN with attention (conv + GRU + attention pooling)
task: vcm
engine: onnx_tinyvcm
weights: ../../../../tiny-vcm/exports/E1_s0/model.onnx
architecture:
  arch: crnn_attn
  width_mult: 1.0
  kernel: 9
  channels: 64
  n_blocks: 4
  dropout_rate: 0.1
  gradient_clip: 1.0
label_scheme: leaf
labels:
- ALARM|6:00 AM
- ALARM|8:00 AM
- ALARM|9:00 PM
- BRIGHTNESS|20 percent
- BRIGHTNESS|60 percent
- BRIGHTNESS|100 percent
- CALL
- COLOR|Red
- COLOR|Blue
- COLOR|Green
- CREATE_REMINDER|Drink water
- CREATE_REMINDER|Study
- CREATE_REMINDER|Exercise
- LIGHT_OFF
- LIGHT_ON
- LIST_REMINDERS
- MESSAGE
- NEXT
- PAUSE
- PLAY_MUSIC
- SILENCE
- STOP
- TEMPERATURE|18 degrees
- TEMPERATURE|22 degrees
- TEMPERATURE|26 degrees
- TIME
- TIMER|10 seconds
- TIMER|30 seconds
- TIMER|1 minute
- UNKNOWN
- VOLUME_DOWN
- VOLUME_UP
- WEATHER
features:
  sample_rate: 16000
  n_mels: 40
  n_fft: 512
  hop_length: 160
  f_min: 50
  f_max: 7600
  top_db: 80.0
  trim_db: 40.0
  max_duration_s: 3.0
reject:
  min_confidence: 0.9
  non_command_labels:
  - UNKNOWN
  - SILENCE
quantization: fp32
lineage:
  training_phase: phase2
  training_data: composite_v1
  git_commit: 363c10d
  mlflow_run_id: null
  notes: registered from ../tiny-vcm/checkpoints/E1_s0/best.pt
offline_metrics: {}
engine_options:
  num_threads: 1
scores:
  training:
    dataset_id: composite_v1
    split: train
    metrics:
      train_acc: 0.9587
    threshold: null
    source: checkpoints/E1_s0/best.pt history (train_acc at best epoch)
    note: on augmented training batches (not comparable to validation)
    status: reported
  validation:
    dataset_id: composite_v1
    split: validation
    metrics:
      command_correct: 0.8615
      tuning_session_correct: 0.939
      command_wrong_mean5: 0.0054
      far_mean5: 0.0089
    threshold: 0.9
    source: CRNN_ATTN_RESULTS.md (McNemar + agreement row; wrong/FAR are 5-seed means)
    status: reported
  test:
    dataset_id: composite_v1
    split: test
    metrics:
      command_correct: 0.969
      command_wrong: 0.0014
      far: 0.0234
      final_test_session_correct: 0.939
      command_macro_f1: 0.9956
    threshold: 0.9
    source: CRNN_ATTN_RESULTS.md test split (one-shot, tau 0.90)
    status: reported
