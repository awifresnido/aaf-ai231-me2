id: A2_s0
display_name: Sweep Basic
description: Early Sweep trained on synthetic voices only. Recognises the command
  type but not slot values (no brightness %, no timer length).
based_on: TC-ResNet (temporal convolution)
task: vcm
engine: onnx_tinyvcm
weights: ../../../../tiny-vcm/exports/A2_s0/model.onnx
architecture:
  arch: tcresnet
  width_mult: 1.0
  kernel: 9
  dropout_rate: 0.1
label_scheme: intent
labels:
- ALARM
- BRIGHTNESS
- CALL
- COLOR
- CREATE_REMINDER
- LIGHT_OFF
- LIGHT_ON
- LIST_REMINDERS
- MESSAGE
- NEXT
- PAUSE
- PLAY_MUSIC
- SILENCE
- STOP
- TEMPERATURE
- TIME
- TIMER
- UNKNOWN
- VOLUME_DOWN
- VOLUME_UP
- WEATHER
features:
  sample_rate: 16000
  n_mels: 40
  n_fft: 512
  hop_length: 160
  f_min: 50
  f_max: 7600
  top_db: 80.0
  trim_db: 40.0
  max_duration_s: 3.0
reject:
  min_confidence: 0.7
  non_command_labels:
  - UNKNOWN
  - SILENCE
quantization: fp32
lineage:
  training_phase: phase1
  training_data: mark_optionb
  git_commit: null
  mlflow_run_id: null
  trained_on: DGX ai-n003
  notes: Intent-mode architecture winner (3-seed mean 0.9967 +/- 0.0014). Predicts
    no slot values, so slotted commands are rejected as non-executable; compare it
    on intent accuracy.
offline_metrics:
  val_intent_acc_mean3: 0.9967
engine_options:
  num_threads: 2
scores:
  training:
    dataset_id: mark_optionb
    split: train
    metrics:
      train_acc: 0.9978
    threshold: null
    source: checkpoints/A2_s0/best.pt history (train_acc at best epoch)
    note: on augmented training batches (not comparable to validation)
    status: reported
  validation:
    dataset_id: mark_optionb
    split: validation
    metrics:
      intent_acc: 0.9975
    threshold: null
    source: ABLATION_RESULTS.md per-seed detail (A2 seed 0)
    status: reported
  test:
    status: not_evaluated
