id: A7_s0
display_name: Sweep Preview
description: Early Sweep trained on synthetic voices only, with slot values. The starting
  point for Sweep.
based_on: TC-ResNet (temporal convolution)
task: vcm
engine: onnx_tinyvcm
weights: ../../../../tiny-vcm/exports/A7_s0/model.onnx
architecture:
  arch: tcresnet
  width_mult: 1.0
  kernel: 9
  dropout_rate: 0.1
label_scheme: leaf
labels:
- ALARM|6:00 AM
- ALARM|8:00 AM
- ALARM|9:00 PM
- BRIGHTNESS|20 percent
- BRIGHTNESS|60 percent
- BRIGHTNESS|100 percent
- CALL
- COLOR|Red
- COLOR|Blue
- COLOR|Green
- CREATE_REMINDER|Drink water
- CREATE_REMINDER|Study
- CREATE_REMINDER|Exercise
- LIGHT_OFF
- LIGHT_ON
- LIST_REMINDERS
- MESSAGE
- NEXT
- PAUSE
- PLAY_MUSIC
- SILENCE
- STOP
- TEMPERATURE|18 degrees
- TEMPERATURE|22 degrees
- TEMPERATURE|26 degrees
- TIME
- TIMER|10 seconds
- TIMER|30 seconds
- TIMER|1 minute
- UNKNOWN
- VOLUME_DOWN
- VOLUME_UP
- WEATHER
features:
  sample_rate: 16000
  n_mels: 40
  n_fft: 512
  hop_length: 160
  f_min: 50
  f_max: 7600
  top_db: 80.0
  trim_db: 40.0
  max_duration_s: 3.0
reject:
  min_confidence: 0.7
  non_command_labels:
  - UNKNOWN
  - SILENCE
quantization: fp32
lineage:
  training_phase: phase1
  training_data: mark_optionb
  git_commit: null
  mlflow_run_id: null
  trained_on: DGX ai-n003
  notes: Phase-1 leaf baseline and phase-2 init. No tau was selected for phase 1;
    0.70 is the app default.
offline_metrics:
  val_intent_acc: 0.9943
engine_options:
  num_threads: 2
scores:
  training:
    dataset_id: mark_optionb
    split: train
    metrics:
      train_acc: 0.9915
    threshold: null
    source: checkpoints/A7_s0/best.pt history (train_acc at best epoch)
    note: on augmented training batches (not comparable to validation)
    status: reported
  validation:
    dataset_id: mark_optionb
    split: validation
    metrics:
      intent_acc: 0.9951
    threshold: null
    source: ABLATION_RESULTS.md per-seed detail (A7 seed 0)
    status: reported
  test:
    status: not_evaluated
